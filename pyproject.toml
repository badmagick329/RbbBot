[tool.poetry]
name = "rbb-bot"
version = "2.0.0"
description = ""
authors = ["badmagick329"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.2.2"
"discord.py" = "2.2"
aiohttp = "^3.14.3"
yarl = "^1.8.1"
aioscheduler = "^1.4.2"
asyncpg = "^0.26.0"
pydantic = "^1.10.2"
numpy = "^1.23.3"
pendulum = "^2.1.2"
Pillow = "^12.3.0"
psycopg2-binary = "^2.9.3"
PyYAML = "^6.0"
beautifulsoup4 = "^4.11.1"
tortoise-orm = "^0.19.2"
aerich = "^0.7.1"
asyncpraw = "^7.6.0"
lxml = "^6.1.0"
python-rapidjson = "^1.8"
dateparser = "^1.1.2"
discord-ext-menus = { git = "https://github.com/Rapptz/discord-ext-menus" }
jishaku = "^2.5.1"
TikTokApi = "^5.2.2"
httpx = "^0.28.1"
certifi = ">=2024.7.4"
cryptography = "^50.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.3.1"
ipykernel = "^6.16.0"
pytest-asyncio = "^0.19.0"
snakeviz = "^2.1.1"
isort = "^5.10.1"


[tool.aerich]
tortoise_orm = "rbb_bot.dbconfig.DB_CONFIG"
location = "./migrations"
src_folder = "."

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-rP"
testpaths = ["tests"]
markers = [
    "integration: requires the dedicated local Postgres test database",
]

[tool.pyright]
include = ["./rbb_bot"]
exclude = [
    "./vnv",
    "**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs",
]
